name: KlaarKompas Android CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build phone + tablet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python for project preflight
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate project structure and release tasks
        run: python tools/validate_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests and lint for both variants
        run: >-
          gradle --no-daemon
          testPhoneDebugUnitTest
          testTabletDebugUnitTest
          lintPhoneDebug
          lintTabletDebug

      - name: Build phone and tablet APKs and AABs (unsigned release outputs)
        run: >-
          gradle --no-daemon
          assemblePhoneDebug
          assembleTabletDebug
          assemblePhoneRelease
          assembleTabletRelease
          bundlePhoneRelease
          bundleTabletRelease

      - name: Label CI output as not for Play upload
        if: always()
        run: |
          mkdir -p build/release-status
          cat > build/release-status/STATUS.txt <<'EOF'
          STATUS: CI/TEST BUILD — NOT A PLAY STORE RELEASE
          Debug APKs are for testing only.
          Release APK/AAB outputs from this workflow are unsigned.
          Do not upload these release files to Google Play.
          To create signed files, add the protected signing secrets described in docs/RELEASE_SIGNING.md,
          merge the release-preparation changes to main, then run the manual workflow:
          Actions -> KlaarKompas Signed Android Release -> Run workflow.
          EOF

      - name: Upload CI and unsigned release artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: klaarkompas-android-${{ github.run_number }}-UNSIGNED
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/tablet/debug/*.apk
            app/build/outputs/apk/phone/release/*.apk
            app/build/outputs/apk/tablet/release/*.apk
            app/build/outputs/bundle/phoneRelease/*.aab
            app/build/outputs/bundle/tabletRelease/*.aab
            app/build/reports/tests/testPhoneDebugUnitTest/**
            app/build/reports/tests/testTabletDebugUnitTest/**
            app/build/reports/lint-results-phoneDebug.html
            app/build/reports/lint-results-tabletDebug.html
            build/release-status/STATUS.txt
