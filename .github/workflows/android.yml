name: KlaarKompas Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build phone + tablet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python for project preflight
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate project structure and release tasks
        run: python tools/validate_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and lint for both variants
        run: >-
          gradle --no-daemon
          testPhoneDebugUnitTest
          testTabletDebugUnitTest
          lintPhoneDebug
          lintTabletDebug

      - name: Build phone and tablet APKs and AABs
        run: >-
          gradle --no-daemon
          assemblePhoneDebug
          assembleTabletDebug
          assemblePhoneRelease
          assembleTabletRelease
          bundlePhoneRelease
          bundleTabletRelease

      - name: Upload APK and AAB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klaarkompas-android-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/tablet/debug/*.apk
            app/build/outputs/apk/phone/release/*.apk
            app/build/outputs/apk/tablet/release/*.apk
            app/build/outputs/bundle/phoneRelease/*.aab
            app/build/outputs/bundle/tabletRelease/*.aab
            app/build/reports/tests/testPhoneDebugUnitTest/**
            app/build/reports/tests/testTabletDebugUnitTest/**
            app/build/reports/lint-results-phoneDebug.html
            app/build/reports/lint-results-tabletDebug.html
